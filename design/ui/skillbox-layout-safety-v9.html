<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SkillBox 安装矩阵与文件安全提示 v9</title>
  <style>
    :root{color-scheme:light;--blue:#087af5;--ink:#202124;--muted:#74777e;--line:#e4e5e8;--soft:#f6f6f7;--green:#28bf63;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}*{box-sizing:border-box}body{margin:0;background:#e9ebef;color:var(--ink);display:grid;place-items:center;min-width:1100px;min-height:720px}.window{width:min(1440px,calc(100vw - 28px));height:min(900px,calc(100vh - 28px));background:white;border-radius:22px;overflow:hidden;box-shadow:0 28px 80px #1f293733;display:grid;grid-template-columns:255px 1fr}aside{padding:20px 14px;background:#f7f7f8;border-right:1px solid var(--line);display:flex;flex-direction:column}.traffic{display:flex;gap:9px;margin:0 3px 26px}.traffic i{width:13px;height:13px;border-radius:50%;background:#ff5f57}.traffic i:nth-child(2){background:#febc2e}.traffic i:nth-child(3){background:#28c840}nav{display:grid;gap:5px}.nav{border-radius:10px;padding:11px 13px;font-weight:600;color:#333}.nav.active{background:var(--blue);color:#fff}.side{margin-top:auto;padding:12px;color:var(--muted);font-size:12px}main{display:grid;grid-template-rows:66px 1fr;min-width:0}.top{display:flex;align-items:center;padding:0 30px;border-bottom:1px solid var(--line);font-weight:700}.content{padding:38px 36px;overflow:auto}.eyebrow{color:var(--blue);font-size:12px;font-weight:750;margin-bottom:7px}h1{font-size:32px;letter-spacing:-.035em;margin:0}.lead{color:var(--muted);font-size:14px;margin:8px 0 24px}.toolbar{display:flex;align-items:flex-start;gap:16px}.toolbar .head{flex:1}.btn{border:1px solid var(--line);background:#f4f4f5;border-radius:9px;padding:9px 15px;font-weight:650}.btn.primary{background:var(--blue);border-color:var(--blue);color:white}.legend{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:11px;margin-bottom:14px}.legend b{font-size:15px;margin-right:4px}.matrix{border:1px solid var(--line);border-radius:14px;overflow:hidden;width:100%}.matrix-row{display:grid;grid-template-columns:minmax(168px,1.6fr) repeat(9,minmax(72px,1fr));align-items:center;min-width:1040px}.matrix-row>div{padding:14px 8px;text-align:center;font-size:11px}.matrix-row>div:first-child{text-align:left;padding-left:18px;font-size:13px;font-weight:650}.matrix-row.head{border-bottom:1px solid var(--line);background:#fbfbfc}.dot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;margin:auto;background:#f0f0f1;color:#777;font-size:18px}.dot.off{color:#8c8f94}.detail-layout{display:grid;grid-template-columns:42% 58%;margin:-38px -36px;height:calc(100% + 76px)}.skill-list{padding:42px 28px;border-right:1px solid var(--line)}.skill{margin-top:22px;background:#d9eaff;border-radius:10px;padding:13px 15px;font-weight:700}.detail{padding:42px 32px;overflow:auto}.skill-name{font-size:23px;font-weight:750}.meta{color:var(--muted);font-size:12px;margin:7px 0 24px}.safe-card{border:1px solid #cfe0fb;background:#f4f8ff;border-radius:15px;padding:18px}.safe-head{display:flex;gap:10px;align-items:flex-start}.safe-icon{width:34px;height:34px;border-radius:10px;background:#e1edff;color:var(--blue);display:grid;place-items:center;font-weight:800}.safe-head b{display:block;font-size:15px}.safe-head p{margin:4px 0 0;color:var(--muted);font-size:11px;line-height:1.55}.finding{border-top:1px solid #dce6f5;padding-top:13px;margin-top:13px}.finding-title{display:flex;gap:10px;font-size:13px;font-weight:700}.tag{margin-left:auto;color:var(--blue);font-size:10px}.finding p{color:var(--muted);font-size:11px;margin:4px 0;line-height:1.5}.code{font-family:ui-monospace,SFMono-Regular,monospace;color:#62666d;font-size:10px}.foot{color:#9a9da3;font-size:10px;margin:14px 0 0}@media(max-width:1180px){.matrix{overflow-x:auto}}
  </style>
</head>
<body>
  <div class="window">
    <aside><div class="traffic"><i></i><i></i><i></i></div><nav><div class="nav">▦　总览</div><div class="nav">▥　我的 Skills</div><div class="nav agents">▦　安装到应用</div><div class="nav">◷　最近操作</div><div class="nav">⚙　设置</div></nav><div class="side">已找到 4 个应用位置</div></aside>
    <main><div class="top" id="top">安装到应用</div><div class="content" id="content"></div></main>
  </div>
  <template id="matrix">
    <div class="toolbar"><div class="head"><div class="eyebrow">按需调整</div><h1>安装到应用</h1><p class="lead">逐个选择 Skill 要安装到哪些应用；批量安装和卸载仍在 Skill 详情中完成。</p></div><button class="btn">添加其他应用</button><button class="btn primary">检查 0 项安装改动</button></div>
    <div class="legend"><span><b>+</b>未选择</span><span><b style="color:#20b95d">✓</b>已选择</span><span><b style="color:#087af5">↑</b>等待安装或更新</span><span><b style="color:#a144e6">⛓</b>间接可用</span><span><b>⊘</b>应用不可用</span><span><b style="color:#ff8b23">!</b>需要处理</span></div>
    <div class="matrix"><div class="matrix-row head"><div>我的 Skills</div><div>Codex</div><div>Claude Code</div><div>Cursor</div><div>Kimi Code</div><div>ZCode</div><div>WorkBuddy</div><div>HanaAgent</div><div>Gemini CLI</div><div>OpenCode</div></div><div class="matrix-row"><div>vibe-project-foundation</div><div><span class="dot">+</span></div><div><span class="dot off">⊘</span></div><div><span class="dot off">⊘</span></div><div><span class="dot off">⊘</span></div><div><span class="dot">+</span></div><div><span class="dot">+</span></div><div><span class="dot">+</span></div><div><span class="dot off">⊘</span></div><div><span class="dot off">⊘</span></div></div></div>
  </template>
  <template id="safety">
    <div class="detail-layout"><section class="skill-list"><div class="eyebrow">集中管理</div><h1>我的 Skills</h1><p class="lead">每个 Skill 在这里保留一份，再由你决定安装到哪些应用。</p><div class="skill">vibe-project-foundation</div></section><section class="detail"><div class="skill-name">vibe-project-foundation</div><div class="meta">GitHub 来源 · 38 个文件</div><div class="safe-card"><div class="safe-head"><div class="safe-icon">i</div><div><b>这份 Skill 有几项文件内容需要了解</b><p>添加和安装 Skill 时不会运行这些文件。下面的命令只有在你或 AI 应用主动运行脚本时才可能执行。</p></div></div><div class="finding"><div class="finding-title">这个 Skill 带有可运行的脚本 <span class="tag">需要了解</span></div><p>只有你或 AI 应用主动调用它时才会运行。文件：scaffold.sh</p></div><div class="finding"><div class="finding-title">脚本会按变量指定的位置清理文件 <span class="tag">需要了解</span></div><p>只有这个脚本被主动运行时才会清理，建议先确认变量最终指向哪个位置。文件：scaffold.sh</p><div class="code">发现：rm -rf "$TARGET"</div></div><div class="finding"><div class="finding-title">说明文档里提到了网址或下载命令 <span class="tag" style="color:#777">仅说明</span></div><p>这只是说明文字，SkillBox 不会执行。文件：README.md</p></div><p class="foot">这是文件内容提示，不代表 Skill 已经运行，也不代表它一定有问题。静态检查无法保证绝对安全。</p></div></section></div>
  </template>
  <script>const screen=new URLSearchParams(location.search).get('screen')||'matrix';document.querySelector('.agents').classList.add('active');document.querySelector('#content').append(document.querySelector('#'+screen).content.cloneNode(true));if(screen==='safety'){document.querySelector('.agents').classList.remove('active');document.querySelectorAll('.nav')[1].classList.add('active');document.querySelector('#top').textContent='我的 Skills'}</script>
</body>
</html>
