<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SkillBox 总览重构 v27</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", sans-serif;
      --ink: #202124;
      --muted: #72757b;
      --faint: #a0a3a8;
      --line: rgba(31, 35, 41, .105);
      --sidebar: #f5f5f7;
      --panel: #f7f7f8;
      --blue: #087cff;
      --blue-soft: #edf6ff;
      --green: #25bf66;
      --green-soft: #ebf8f0;
      --orange: #f49725;
      --orange-soft: #fff4e7;
      --shadow: 0 14px 42px rgba(15, 23, 42, .08), 0 2px 8px rgba(15, 23, 42, .04);
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #e8e8ea; color: var(--ink); }
    button { font: inherit; }
    #stage { width: 100%; height: 100%; }

    .window {
      width: 100%;
      height: 100%;
      min-width: 1080px;
      min-height: 680px;
      display: grid;
      grid-template-columns: 232px minmax(0, 1fr);
      overflow: hidden;
      background: #fff;
    }

    .sidebar {
      position: relative;
      z-index: 50;
      padding: 76px 14px 18px;
      background: rgba(246, 246, 248, .94);
      border-right: 1px solid var(--line);
    }

    .traffic { position: absolute; left: 20px; top: 20px; display: flex; gap: 9px; }
    .traffic i { width: 13px; height: 13px; border-radius: 50%; display: block; }
    .traffic i:nth-child(1) { background: #ff5f57; }
    .traffic i:nth-child(2) { background: #febc2e; }
    .traffic i:nth-child(3) { background: #28c840; }
    .sidebar-toggle { position: absolute; right: 20px; top: 17px; font-size: 18px; color: #4f5358; }

    .nav { display: grid; gap: 5px; }
    .nav-item {
      height: 42px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 12px;
      border-radius: 10px;
      color: #24272b;
      font-size: 15px;
      font-weight: 560;
    }
    .nav-item.active { background: var(--blue); color: #fff; }
    .nav-icon { width: 20px; text-align: center; font-size: 16px; }
    .sidebar-foot { position: absolute; left: 18px; right: 18px; bottom: 18px; color: #85888e; font-size: 11px; }

    .map-window { width: 100%; height: 100%; min-width: 1080px; display: grid; grid-template-columns: 74px minmax(0,1fr); background: #fff; }
    .map-rail { position: relative; z-index: 50; display: flex; flex-direction: column; align-items: center; gap: 9px; padding: 74px 0 18px; background: #f5f5f7; border-right: 1px solid var(--line); }
    .map-traffic { position: absolute; top: 20px; left: 16px; display: flex; gap: 6px; }
    .map-traffic i { display: block; width: 9px; height: 9px; border-radius: 50%; }
    .map-traffic i:nth-child(1) { background:#ff5f57; } .map-traffic i:nth-child(2) { background:#febc2e; } .map-traffic i:nth-child(3) { background:#28c840; }
    .map-nav { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 11px; color: #6f7379; font-size: 15px; }
    .map-nav.active { color: #fff; background: var(--blue); }
    .map-content { min-width: 0; height: 100%; overflow: auto; }

    .content { min-width: 0; height: 100%; overflow: auto; background: #fff; }
    .topbar {
      height: 58px;
      padding: 0 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
      background: rgba(255,255,255,.9);
      backdrop-filter: blur(18px);
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .topbar-title { font-size: 15px; font-weight: 650; }
    .icon-button {
      width: 34px; height: 34px; border: 0; border-radius: 50%; background: #f3f3f4; color: #3f4348;
      cursor: pointer; transition: transform 120ms ease-out, background 120ms ease-out;
    }
    .icon-button:hover { background: #eaeaed; }
    .icon-button:active { transform: scale(.95); }

    .page { padding: 32px 36px 92px; max-width: 1440px; margin: 0 auto; }
    .eyebrow { color: var(--blue); font-size: 12px; font-weight: 700; margin-bottom: 8px; }
    h1 { margin: 0; font-size: 30px; line-height: 1.15; letter-spacing: -.025em; }
    h2, h3, p { margin: 0; }
    .subtitle { color: var(--muted); font-size: 14px; line-height: 1.55; margin-top: 8px; }
    .section-title { font-size: 14px; font-weight: 680; }
    .section-note { color: var(--muted); font-size: 12px; line-height: 1.5; }
    .card { border: 1px solid var(--line); border-radius: 16px; background: #fff; }
    .soft-card { border-radius: 16px; background: var(--panel); }
    .primary-btn, .secondary-btn, .text-btn {
      border: 0; cursor: pointer; font-weight: 620; transition: transform 120ms ease-out, filter 120ms ease-out, background 120ms ease-out;
    }
    .primary-btn { height: 34px; padding: 0 15px; border-radius: 9px; color: #fff; background: var(--blue); font-size: 13px; }
    .secondary-btn { height: 34px; padding: 0 14px; border-radius: 9px; color: #272a2e; background: #eeeeef; font-size: 13px; }
    .text-btn { padding: 4px 0; color: var(--blue); background: transparent; font-size: 12px; }
    .primary-btn:hover, .secondary-btn:hover { filter: brightness(.97); }
    .primary-btn:active, .secondary-btn:active { transform: scale(.97); }
    .badge { display: inline-flex; align-items: center; gap: 6px; min-height: 24px; padding: 0 9px; border-radius: 999px; font-size: 11px; font-weight: 620; }
    .badge.good { background: var(--green-soft); color: #16864a; }
    .badge.info { background: var(--blue-soft); color: #176dbc; }
    .badge.neutral { background: #efeff1; color: #6f7379; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

    /* Variant 1: Today */
    .today-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 24px; }
    .today-status {
      margin-top: 24px; padding: 22px 24px; display: grid; grid-template-columns: 48px minmax(0,1fr) auto; gap: 16px; align-items: center;
      border-radius: 18px; background: linear-gradient(135deg, #eff8f3, #f7fbf8); border: 1px solid rgba(37,191,102,.15);
    }
    .status-mark { width: 48px; height: 48px; border-radius: 15px; display: grid; place-items: center; color: #148d4b; background: #dcf5e6; font-size: 22px; font-weight: 800; }
    .today-status h2 { font-size: 18px; letter-spacing: -.012em; }
    .today-status p { color: #66726b; font-size: 12px; margin-top: 5px; }
    .today-grid { margin-top: 24px; display: grid; grid-template-columns: minmax(0,1.55fr) minmax(310px,.75fr); gap: 18px; }
    .focus-card { padding: 20px; }
    .focus-head, .apps-head, .activity-head { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
    .task-list { margin-top: 14px; border-top: 1px solid var(--line); }
    .task-row { display: grid; grid-template-columns: 38px minmax(0,1fr) auto; align-items: center; gap: 12px; padding: 14px 2px; border-bottom: 1px solid var(--line); }
    .task-icon { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 10px; background: var(--blue-soft); color: var(--blue); font-weight: 800; }
    .task-title { font-size: 13px; font-weight: 650; }
    .task-detail { color: var(--muted); font-size: 11px; margin-top: 4px; }
    .today-side { display: grid; gap: 18px; align-content: start; }
    .mini-library { padding: 20px; }
    .library-number { margin-top: 16px; display: flex; align-items: baseline; gap: 8px; }
    .library-number strong { font-size: 32px; letter-spacing: -.03em; }
    .library-number span { color: var(--muted); font-size: 12px; }
    .library-actions { display: flex; gap: 8px; margin-top: 16px; }
    .apps-strip { padding: 18px 20px; }
    .app-avatars { display: flex; align-items: center; margin-top: 16px; }
    .app-avatar { width: 36px; height: 36px; display: grid; place-items: center; margin-right: -5px; border: 3px solid #fff; border-radius: 12px; color: #fff; font-size: 12px; font-weight: 750; box-shadow: 0 2px 8px rgba(15,23,42,.08); }
    .app-avatar:nth-child(1) { background: #111; }
    .app-avatar:nth-child(2) { background: #da7849; }
    .app-avatar:nth-child(3) { background: #4263eb; }
    .app-avatar:nth-child(4) { background: #6d5ce7; }
    .app-avatar:nth-child(5) { background: #18a66a; }
    .app-avatar.more { background: #ebeced; color: #6f7379; }

    /* Variant 2: Flow */
    .flow-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 18px; }
    .flow-board { margin-top: 24px; padding: 26px; min-height: 410px; position: relative; overflow: hidden; background: radial-gradient(circle at 50% 48%, #f5f9ff 0, #fff 48%); }
    .flow-board::before { content: ""; position: absolute; inset: 0; opacity: .3; background-image: radial-gradient(#aab7c8 0.7px, transparent 0.7px); background-size: 18px 18px; }
    .flow-canvas { position: relative; z-index: 1; height: 355px; display: grid; grid-template-columns: minmax(280px,.9fr) minmax(300px,1.15fr) minmax(280px,.9fr); align-items: center; gap: 34px; }
    .flow-column { display: grid; gap: 10px; }
    .flow-node { padding: 14px 15px; border-radius: 13px; background: rgba(255,255,255,.93); border: 1px solid var(--line); box-shadow: 0 7px 20px rgba(24,39,75,.055); }
    .flow-node .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .flow-node strong { font-size: 13px; }
    .flow-node small { display: block; margin-top: 5px; color: var(--muted); font-size: 10px; }
    .flow-center { padding: 28px; border-radius: 24px; text-align: center; background: #fff; border: 1px solid rgba(8,124,255,.18); box-shadow: 0 18px 50px rgba(8,124,255,.11); }
    .box-symbol { width: 68px; height: 68px; margin: 0 auto 15px; display: grid; place-items: center; border-radius: 20px; color: #fff; background: linear-gradient(150deg, #3198ff, #086dff); font-size: 28px; font-weight: 760; box-shadow: 0 12px 24px rgba(8,124,255,.24); }
    .flow-center h2 { font-size: 20px; }
    .flow-center p { margin: 7px auto 16px; max-width: 280px; color: var(--muted); font-size: 11px; line-height: 1.55; }
    .connector { position: absolute; z-index: 0; top: 50%; height: 1px; background: linear-gradient(90deg, transparent, rgba(8,124,255,.28), transparent); }
    .connector.left { left: 18%; right: 49%; }
    .connector.right { left: 51%; right: 18%; }
    .flow-bottom { margin-top: 18px; display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    .flow-action { padding: 18px 20px; display: flex; align-items: center; gap: 14px; }
    .flow-action .task-icon { flex: 0 0 auto; }
    .flow-action .grow { min-width: 0; flex: 1; }

    /* Variant 3: Workbench */
    .workbench-head { display: flex; justify-content: space-between; align-items: flex-start; }
    .workbench { margin-top: 24px; display: grid; grid-template-columns: minmax(0,1.45fr) minmax(330px,.7fr); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; min-height: 540px; }
    .work-main { padding: 22px; background: #fff; }
    .work-rail { padding: 22px; background: #f6f6f7; border-left: 1px solid var(--line); }
    .hero-action { padding: 22px; margin-top: 16px; border-radius: 16px; background: linear-gradient(130deg, #edf6ff, #f6faff); border: 1px solid rgba(8,124,255,.13); }
    .hero-action-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; }
    .hero-action h2 { font-size: 18px; }
    .hero-action p { color: var(--muted); font-size: 12px; line-height: 1.55; margin-top: 6px; max-width: 560px; }
    .hero-meta { display: flex; gap: 18px; margin-top: 18px; padding-top: 16px; border-top: 1px solid rgba(8,124,255,.12); }
    .hero-meta div { min-width: 90px; }
    .hero-meta strong { display: block; font-size: 18px; }
    .hero-meta span { color: var(--muted); font-size: 10px; }
    .quiet-actions { margin-top: 18px; }
    .quiet-row { display: grid; grid-template-columns: 24px minmax(0,1fr) auto; gap: 12px; align-items: center; padding: 13px 4px; border-bottom: 1px solid var(--line); }
    .quiet-check { color: var(--green); font-weight: 800; }
    .quiet-row strong { font-size: 12px; }
    .quiet-row small { display: block; margin-top: 3px; color: var(--muted); font-size: 10px; }
    .rail-summary { padding-bottom: 18px; border-bottom: 1px solid var(--line); }
    .rail-number { font-size: 26px; font-weight: 720; letter-spacing: -.025em; margin-top: 10px; }
    .app-list { margin-top: 16px; display: grid; gap: 7px; }
    .app-item { padding: 10px; display: grid; grid-template-columns: 30px minmax(0,1fr) auto; align-items: center; gap: 10px; border-radius: 11px; background: rgba(255,255,255,.72); }
    .app-logo { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 9px; color: #fff; background: #23252a; font-size: 10px; font-weight: 750; }
    .app-item strong { font-size: 11px; }
    .app-item small { display: block; color: var(--muted); font-size: 9px; margin-top: 2px; }
    .state-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); }
    .state-dot.off { background: #c1c3c7; }

    .overlay { position: fixed; inset: 0; z-index: 2000; display: grid; place-items: center; background: rgba(24,27,32,.28); backdrop-filter: blur(4px); }
    .dialog { width: min(620px, calc(100vw - 48px)); padding: 24px; border-radius: 18px; background: #fff; box-shadow: var(--shadow); }
    .dialog-head { display: flex; justify-content: space-between; align-items: start; gap: 16px; }
    .dialog h2 { font-size: 20px; }
    .dialog p { margin-top: 7px; color: var(--muted); font-size: 12px; line-height: 1.55; }
    .version-list { margin-top: 18px; display: grid; gap: 10px; }
    .version { padding: 14px; border: 1px solid var(--line); border-radius: 12px; display: flex; gap: 12px; align-items: center; cursor: pointer; }
    .version.selected { border-color: rgba(8,124,255,.5); background: var(--blue-soft); }
    .radio { width: 17px; height: 17px; border: 2px solid #b7bbc0; border-radius: 50%; }
    .version.selected .radio { border: 5px solid var(--blue); }
    .version strong { font-size: 12px; }
    .version small { display: block; margin-top: 4px; color: var(--muted); font-size: 10px; }
    .dialog-safe { margin-top: 14px; padding: 11px 12px; border-radius: 10px; color: #337151; background: var(--green-soft); font-size: 11px; }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
    .toast { position: fixed; left: 50%; bottom: 76px; z-index: 3000; transform: translateX(-50%); padding: 10px 15px; color: #fff; background: rgba(29,31,35,.9); border-radius: 10px; font-size: 12px; box-shadow: var(--shadow); animation: toast-in 180ms ease-out; }
    @keyframes toast-in { from { opacity: 0; transform: translate(-50%, 6px); } }
    @media (prefers-reduced-motion: reduce) { .toast { animation: none; } }

    .proto-picker {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2147483647;
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 4px;
      border-radius: 999px;
      background: rgba(10, 10, 10, 0.82);
      -webkit-backdrop-filter: blur(12px) saturate(1.4);
      backdrop-filter: blur(12px) saturate(1.4);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.08) inset,
        0 8px 24px rgba(0, 0, 0, 0.24),
        0 2px 6px rgba(0, 0, 0, 0.12);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      line-height: 1;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      -webkit-user-select: none;
    }

    .proto-picker-highlight {
      position: absolute;
      top: 4px;
      left: 0;
      height: 28px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      will-change: transform;
    }

    .proto-picker[data-ready] .proto-picker-highlight {
      transition:
        transform 250ms cubic-bezier(0.23, 1, 0.32, 1),
        width 250ms cubic-bezier(0.23, 1, 0.32, 1);
    }

    @media (prefers-reduced-motion: reduce) {
      .proto-picker[data-ready] .proto-picker-highlight { transition: none; }
    }

    .proto-picker-item {
      position: relative;
      display: flex;
      align-items: center;
      height: 28px;
      padding: 0 12px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: rgba(255, 255, 255, 0.55);
      font: inherit;
      cursor: pointer;
      transition: color 150ms ease-out;
    }

    .proto-picker-item:hover { color: rgba(255, 255, 255, 0.85); }
    .proto-picker-item:active { transform: scale(0.97); }
    .proto-picker-item:focus-visible { outline: 2px solid rgba(255, 255, 255, 0.4); outline-offset: 2px; }
    .proto-picker-item[data-active] { color: #fff; }

    .proto-picker-divider {
      width: 1px;
      height: 16px;
      margin: 0 4px;
      background: rgba(255, 255, 255, 0.12);
    }

    .proto-picker-replay { padding: 0 10px; font-size: 14px; }
    .proto-picker[data-position="top"] { bottom: auto; top: 24px; }
  </style>
</head>
<body>
  <main id="stage"></main>
  <nav class="proto-picker" aria-label="Prototype variants">
    <span class="proto-picker-highlight" aria-hidden="true"></span>
    <button class="proto-picker-item" data-active aria-current="true">今日行动</button>
    <button class="proto-picker-item">管理路径</button>
    <button class="proto-picker-item">双栏工作台</button>
    <span class="proto-picker-divider" aria-hidden="true"></span>
    <button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">↻</button>
  </nav>

  <script>
    const shell = (body, label = '总览') => `
      <div class="window">
        <aside class="sidebar">
          <div class="traffic"><i></i><i></i><i></i></div><div class="sidebar-toggle">▣</div>
          <nav class="nav">
            <div class="nav-item active"><span class="nav-icon">▦</span>总览</div>
            <div class="nav-item"><span class="nav-icon">▥</span>我的 Skills</div>
            <div class="nav-item"><span class="nav-icon">⌕</span>发现 Skills</div>
            <div class="nav-item"><span class="nav-icon">▦</span>安装到应用</div>
            <div class="nav-item"><span class="nav-icon">◴</span>最近操作</div>
            <div class="nav-item"><span class="nav-icon">⚙︎</span>设置</div>
          </nav>
          <div class="sidebar-foot">本机已发现 5 个应用位置</div>
        </aside>
        <section class="content">
          <header class="topbar"><span class="topbar-title">${label}</span><button class="icon-button" data-action="scan" title="重新查看本机 Skills">↻</button></header>
          ${body}
        </section>
      </div>`;

    const mapShell = (body) => `
      <div class="map-window">
        <aside class="map-rail">
          <div class="map-traffic"><i></i><i></i><i></i></div>
          <div class="map-nav active">▦</div><div class="map-nav">▥</div><div class="map-nav">⌕</div><div class="map-nav">▦</div><div class="map-nav">◴</div><div class="map-nav">⚙︎</div>
        </aside>
        <section class="map-content">${body}</section>
      </div>`;

    const today = () => shell(`
      <div class="page">
        <div class="today-head">
          <div><div class="eyebrow">今天的 SkillBox</div><h1>Skills 管理正常</h1><p class="subtitle">现有 AI 应用继续照常使用。你有一项整理工作，可以现在处理，也可以以后再说。</p></div>
          <button class="secondary-btn" data-action="library">打开我的 Skills</button>
        </div>
        <section class="today-status">
          <div class="status-mark">✓</div>
          <div><h2>没有更新或安装故障</h2><p>5 个中央 Skill 和 3 份受管理安装状态正常</p></div>
          <span class="badge good"><i class="dot"></i>状态良好</span>
        </section>
        <div class="today-grid">
          <section class="card focus-card">
            <div class="focus-head"><div><h2 class="section-title">接下来可以做</h2><p class="section-note">这里只放真正需要你决定的事情</p></div><span class="badge neutral">1 项</span></div>
            <div class="task-list">
              <div class="task-row">
                <div class="task-icon">≋</div>
                <div><div class="task-title">整理同名 Skill 的不同版本</div><div class="task-detail">发现 28 组同名内容。暂不处理不会影响任何应用。</div></div>
                <button class="primary-btn" data-action="versions">开始整理</button>
              </div>
              <div class="task-row">
                <div class="task-icon" style="background:var(--green-soft);color:var(--green)">✓</div>
                <div><div class="task-title">检查 Skill 更新</div><div class="task-detail">目前没有等待下载的新版本</div></div>
                <button class="text-btn" data-action="updates">查看记录</button>
              </div>
            </div>
          </section>
          <div class="today-side">
            <section class="soft-card mini-library">
              <div class="section-title">我的 Skills</div>
              <div class="library-number"><strong>5</strong><span>份可信原件集中保存在本机</span></div>
              <div class="library-actions"><button class="primary-btn" data-action="library">管理 Skills</button><button class="secondary-btn" data-action="add">添加</button></div>
            </section>
            <section class="card apps-strip">
              <div class="apps-head"><div><div class="section-title">AI 应用</div><div class="section-note">5 个已找到 · 4 个尚未使用</div></div><button class="text-btn" data-action="apps">管理位置</button></div>
              <div class="app-avatars"><div class="app-avatar">C</div><div class="app-avatar">Cl</div><div class="app-avatar">Z</div><div class="app-avatar">W</div><div class="app-avatar">H</div><div class="app-avatar more">+4</div></div>
            </section>
          </div>
        </div>
      </div>`);

    const flowNode = (name, detail, right = '') => `<div class="flow-node"><div class="row"><strong>${name}</strong>${right}</div><small>${detail}</small></div>`;
    const flow = () => mapShell(`
      <div class="page">
        <div class="flow-head">
          <div><div class="eyebrow">你的 Skill 管理路径</div><h1>一份原件，按需安装到多个应用</h1><p class="subtitle">先在 SkillBox 中确定要管理的版本，再决定哪些 AI 应用使用它。</p></div>
          <button class="primary-btn" data-action="add">添加 Skill</button>
        </div>
        <section class="card flow-board">
          <div class="connector left"></div><div class="connector right"></div>
          <div class="flow-canvas">
            <div class="flow-column">
              ${flowNode('本机发现的 Skills', '在不同应用和通用目录中只读查看', '<span class="badge neutral">172 份</span>')}
              ${flowNode('同名版本待选择', '28 组可以逐一比较，稍后处理也没关系', '<span class="badge info">查看</span>')}
              ${flowNode('来源与更新', 'GitHub 和本地开发源保持独立', '<span class="badge good">正常</span>')}
            </div>
            <div class="flow-center">
              <div class="box-symbol">S</div><h2>我的 Skills</h2><p>这里保存你确认过的中央原件。选择版本不会删除各应用中的原文件。</p>
              <div class="library-number" style="justify-content:center;margin-top:0"><strong>5</strong><span>份中央原件</span></div>
              <div class="library-actions" style="justify-content:center"><button class="primary-btn" data-action="library">查看中央库</button><button class="secondary-btn" data-action="versions">整理版本</button></div>
            </div>
            <div class="flow-column">
              ${flowNode('Codex', '已找到 · 2 份受管理安装', '<span class="badge good">已连接</span>')}
              ${flowNode('Claude Code', '已找到 · 1 份受管理安装', '<span class="badge good">已连接</span>')}
              ${flowNode('其他 AI 应用', 'ZCode、WorkBuddy、HanaAgent 可用', '<span class="badge neutral">3 个</span>')}
            </div>
          </div>
        </section>
        <div class="flow-bottom">
          <section class="card flow-action"><div class="task-icon">≋</div><div class="grow"><div class="task-title">28 组同名 Skill 有不同版本</div><div class="task-detail">比较后选择中央原件，不改动原位置</div></div><button class="primary-btn" data-action="versions">开始整理</button></section>
          <section class="card flow-action"><div class="task-icon" style="background:var(--green-soft);color:var(--green)">✓</div><div class="grow"><div class="task-title">安装与更新状态正常</div><div class="task-detail">没有需要立即处理的问题</div></div><button class="text-btn" data-action="apps">查看分发</button></section>
        </div>
      </div>`);

    const appItem = (logo, name, detail, enabled = true) => `<div class="app-item"><div class="app-logo">${logo}</div><div><strong>${name}</strong><small>${detail}</small></div><i class="state-dot ${enabled ? '' : 'off'}"></i></div>`;
    const workbench = () => shell(`
      <div class="page">
        <div class="workbench-head">
          <div><div class="eyebrow">管理工作台</div><h1>先处理重要的，其余保持安静</h1><p class="subtitle">左边是需要决定的事项，右边长期显示本机应用环境。</p></div>
          <button class="primary-btn" data-action="add">添加 Skill</button>
        </div>
        <section class="workbench">
          <div class="work-main">
            <div class="focus-head"><div><h2 class="section-title">需要你决定</h2><p class="section-note">操作前始终可以查看影响范围</p></div><span class="badge neutral">1 项</span></div>
            <div class="hero-action">
              <div class="hero-action-top"><div><h2>选择同名 Skill 的管理版本</h2><p>同一个名字在不同应用中出现了多个版本。你只需要决定哪一份进入 SkillBox；所有原文件会继续留在原来的应用里。</p></div><button class="primary-btn" data-action="versions">逐个整理</button></div>
              <div class="hero-meta"><div><strong>28</strong><span>组同名版本</span></div><div><strong>0</strong><span>项必须立刻处理</span></div><div><strong>只读</strong><span>打开比较页</span></div></div>
            </div>
            <div class="quiet-actions">
              <div class="focus-head"><div><h2 class="section-title">其余状态</h2><p class="section-note">正常项目不占用你的注意力</p></div></div>
              <div class="quiet-row"><span class="quiet-check">✓</span><div><strong>5 个中央 Skill 保存正常</strong><small>内容和组织状态完整</small></div><button class="text-btn" data-action="library">查看</button></div>
              <div class="quiet-row"><span class="quiet-check">✓</span><div><strong>没有等待确认的更新</strong><small>下载与安装都不会自动发生</small></div><button class="text-btn" data-action="updates">记录</button></div>
              <div class="quiet-row"><span class="quiet-check">✓</span><div><strong>最近操作可以恢复</strong><small>上一次变更已留下恢复点</small></div><button class="text-btn" data-action="history">打开</button></div>
            </div>
          </div>
          <aside class="work-rail">
            <div class="rail-summary"><div class="section-title">AI 应用环境</div><div class="rail-number">5 <span style="font-size:12px;color:var(--muted);font-weight:500">/ 9 已找到</span></div><p class="section-note" style="margin-top:4px">这里只表示应用位置是否存在，安装关系到“安装到应用”中管理。</p></div>
            <div class="app-list">
              ${appItem('C', 'Codex', '已找到 · 2 份安装')}
              ${appItem('Cl', 'Claude Code', '已找到 · 1 份安装')}
              ${appItem('Z', 'ZCode', '已找到')}
              ${appItem('W', 'WorkBuddy', '已找到')}
              ${appItem('H', 'HanaAgent', '已找到')}
              ${appItem('Cu', 'Cursor', '尚未在本机使用', false)}
              ${appItem('G', 'Gemini CLI', '尚未在本机使用', false)}
            </div>
            <button class="secondary-btn" data-action="apps" style="width:100%;margin-top:14px">管理安装位置</button>
          </aside>
        </section>
      </div>`);

    const variants = [today, flow, workbench];
    const stage = document.getElementById('stage');
    const picker = document.querySelector('.proto-picker');
    const highlight = picker.querySelector('.proto-picker-highlight');
    const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
    const replay = picker.querySelector('.proto-picker-replay');
    let current = 0;

    function moveHighlight() {
      const el = items[current];
      highlight.style.width = el.offsetWidth + 'px';
      highlight.style.transform = `translateX(${el.offsetLeft}px)`;
    }

    function mount(i) {
      stage.innerHTML = '';
      requestAnimationFrame(() => { stage.innerHTML = variants[i](); });
    }

    function setActive(i) {
      if (i < 0 || i >= variants.length) return;
      current = i;
      items.forEach((el, j) => {
        el.toggleAttribute('data-active', j === i);
        if (j === i) el.setAttribute('aria-current', 'true');
        else el.removeAttribute('aria-current');
      });
      moveHighlight();
      const url = new URL(location);
      url.searchParams.set('v', i + 1);
      history.replaceState(null, '', url);
      mount(i);
    }

    items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
    replay?.addEventListener('click', () => mount(current));
    window.addEventListener('resize', moveHighlight);

    document.addEventListener('keydown', (e) => {
      if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      const num = parseInt(e.key, 10);
      if (num >= 1 && num <= variants.length) setActive(num - 1);
      else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
      else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
      else if (e.key === 'r' || e.key === 'R') mount(current);
    });

    function closeDialog() { document.querySelector('.overlay')?.remove(); }
    function showVersions() {
      const overlay = document.createElement('div');
      overlay.className = 'overlay';
      overlay.innerHTML = `<div class="dialog"><div class="dialog-head"><div><h2>先看一组：agent-team</h2><p>这两份名称相同，内容存在差异。选中只代表“准备加入 SkillBox”，关闭此窗口不会产生任何变化。</p></div><button class="icon-button" data-close>×</button></div><div class="version-list"><div class="version selected"><i class="radio"></i><div><strong>来自 Codex 的版本</strong><small>5 个文件 · 当前 SkillBox 中的版本与它一致</small></div></div><div class="version"><i class="radio"></i><div><strong>来自其他应用的版本</strong><small>7 个文件 · 比 Codex 版本多 2 个说明文件</small></div></div></div><div class="dialog-safe">无论选择哪一份，其他应用中的原文件都不会被删除、覆盖或移动。</div><div class="dialog-actions"><button class="secondary-btn" data-close>稍后处理</button><button class="primary-btn" data-action="choose">将这一份加入 SkillBox</button></div></div>`;
      document.body.appendChild(overlay);
      overlay.querySelectorAll('.version').forEach(el => el.addEventListener('click', () => { overlay.querySelectorAll('.version').forEach(v => v.classList.remove('selected')); el.classList.add('selected'); }));
      overlay.querySelectorAll('[data-close]').forEach(el => el.addEventListener('click', closeDialog));
    }

    function toast(text) {
      document.querySelector('.toast')?.remove();
      const el = document.createElement('div'); el.className = 'toast'; el.textContent = text; document.body.appendChild(el);
      setTimeout(() => el.remove(), 1800);
    }

    document.addEventListener('click', (event) => {
      const action = event.target.closest('[data-action]')?.dataset.action;
      if (!action) return;
      if (action === 'versions') showVersions();
      else if (action === 'choose') { closeDialog(); toast('原型演示：已准备加入，正式操作仍会再次确认'); }
      else if (action === 'scan') toast('原型演示：正在重新查看本机 Skills');
      else toast('原型演示：将进入对应的现有页面');
    });

    setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
    requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
    if (new URLSearchParams(location.search).get('dialog') === '1') {
      requestAnimationFrame(() => requestAnimationFrame(showVersions));
    }
  </script>
</body>
</html>
