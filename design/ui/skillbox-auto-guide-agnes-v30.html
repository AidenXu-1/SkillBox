<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SkillBox v30 · Agnes 自动整理</title>
  <style>
    :root{color-scheme:light;--blue:#087af5;--blue-dark:#0068df;--text:#1d1d1f;--muted:#6e6e73;--line:rgba(30,30,35,.11);--shadow:0 32px 90px rgba(20,25,34,.30)}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC",sans-serif;color:var(--text);background:#e7eaf0}button{font:inherit;cursor:default}
    iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:white}
    .scrim{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:40px;background:rgba(24,28,35,.27);backdrop-filter:blur(7px) saturate(105%);opacity:1;transition:opacity .22s ease}
    .scrim.hide{opacity:0;pointer-events:none}.sheet{width:min(530px,92vw);overflow:hidden;border:1px solid rgba(255,255,255,.86);border-radius:21px;background:rgba(255,255,255,.97);box-shadow:var(--shadow);transform:translateY(0) scale(1);transition:transform .28s cubic-bezier(.2,.85,.25,1);backdrop-filter:blur(32px) saturate(165%)}.scrim.hide .sheet{transform:translateY(12px) scale(.975)}
    .sheet-head{padding:24px 25px 17px;display:grid;grid-template-columns:44px minmax(0,1fr);gap:13px;align-items:start}.mark{width:44px;height:44px;border-radius:13px;background:linear-gradient(145deg,#dcecff,#f7fbff);color:var(--blue);display:grid;place-items:center;box-shadow:0 5px 17px rgba(31,90,150,.10)}.mark svg{width:23px;height:23px}.provider{display:inline-flex;align-items:center;gap:5px;margin-bottom:7px;padding:3px 7px;border-radius:999px;background:#edf6ff;color:#126cbf;font-size:9.5px;font-weight:680}.provider i{width:6px;height:6px;border-radius:50%;background:#28b864}.sheet h1{margin:0;font-size:22px;line-height:1.18;letter-spacing:-.04em}.lead{margin:7px 0 0;color:#5f6670;font-size:12px;line-height:1.48}
    .sheet-body{padding:0 25px 20px}.data-note{padding:11px 12px;border-radius:11px;background:#f4f5f7;display:grid;grid-template-columns:18px 1fr;gap:8px;align-items:start;color:#656b73;font-size:10.8px;line-height:1.55}.data-note i{width:17px;height:17px;margin-top:0;border:1px solid #aab2bb;border-radius:50%;color:#737d87;font-style:normal;font-size:9px;font-weight:750;display:grid;place-items:center}.scope-note{margin:9px 2px 0;color:#8a8f95;font-size:9.8px}
    .sheet-foot{padding:13px 18px;border-top:1px solid var(--line);background:rgba(248,248,249,.92);display:flex;justify-content:flex-end;align-items:center;gap:8px}.btn{min-height:36px;padding:0 13px;border:1px solid var(--line);border-radius:10px;background:white;color:#303034;font-size:11.5px;font-weight:650}.btn.primary{border-color:var(--blue);background:var(--blue);color:white;box-shadow:0 2px 8px rgba(0,105,220,.18)}.btn.primary:hover{background:var(--blue-dark)}.btn:active{transform:scale(.97)}
    .toast{position:fixed;z-index:20;left:50%;bottom:38px;padding:10px 14px;border-radius:10px;background:rgba(32,32,35,.92);color:white;font-size:11px;opacity:0;transform:translate(-50%,12px);transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.scrim.hide .sheet{transform:none}}
    @media(max-width:650px){.sheet-foot{align-items:stretch;flex-direction:column}.btn{width:100%}}
  </style>
</head>
<body>
  <iframe id="appFrame" title="SkillBox 我的 Skills"></iframe>
  <div class="scrim" id="consent">
    <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="consentTitle">
      <header class="sheet-head">
        <div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3 5 6v5c0 4.5 2.7 8 7 10 4.3-2 7-5.5 7-10V6z"/><path d="m9.5 12 1.6 1.6 3.8-4"/></svg></div>
        <div><span class="provider"><i></i>Agnes 2.5 Flash</span><h1 id="consentTitle">自动补齐 Skill 介绍</h1><p class="lead">同意一次，现有和以后新增的 Skill 都会自动整理。</p></div>
      </header>
      <div class="sheet-body">
        <div class="data-note"><i>i</i><span>Agnes 只读取 SKILL.md、README 等说明文字；脚本、密钥、图片和完整文件夹不会发送，也不会运行 Skill。</span></div>
        <p class="scope-note">可随时在设置中关闭</p>
      </div>
      <footer class="sheet-foot"><button class="btn" id="decline">暂不用</button><button class="btn primary" id="allow">同意并开启</button></footer>
    </section>
  </div>
  <div class="toast" id="toast">已暂不使用，可稍后在设置中开启</div>
  <script>
    const frame=document.querySelector('#appFrame');
    const consent=document.querySelector('#consent');
    const params=new URLSearchParams(location.search);
    const requested=params.get('state')||'consent';
    function url(state){return `skillbox-local-guide-consent-v29.html?state=${state}`}
    function showState(state){
      frame.src=url(state==='consent'?'declined':state);
      consent.classList.toggle('hide',state!=='consent');
    }
    showState(requested);
    document.querySelector('#allow').addEventListener('click',()=>{
      consent.classList.add('hide');
      frame.src=url('loading');
      window.setTimeout(()=>{frame.src=url('complete')},1450);
    });
    document.querySelector('#decline').addEventListener('click',()=>{
      consent.classList.add('hide');frame.src=url('declined');
      const toast=document.querySelector('#toast');toast.classList.add('show');window.setTimeout(()=>toast.classList.remove('show'),1500);
    });
  </script>
</body>
</html>
